<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Preview (GPU Zero-Copy)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #0f0;
        font-family: "SF Mono", Menlo, monospace;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 12px;
        border-radius: 4px;
        z-index: 100;
      }
      canvas {
        max-width: 100%;
        max-height: calc(100vh - 20px);
        object-fit: contain;
        background: #000;
      }
      .error {
        color: #f44;
      }
    </style>
  </head>
  <body>
    <div id="info">Initializing WebGPU...</div>
    <canvas id="preview"></canvas>
    <!-- Drawing lives in preview-preload.js (binds the shared-texture receiver
         and renders with WebGPU); this page is markup + styles only. -->
  </body>
</html>
