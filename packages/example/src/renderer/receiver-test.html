<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Syphon Receiver Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #111;
        color: #eee;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        gap: 8px;
      }
      h1 {
        font-size: 16px;
      }
      #controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      select {
        background: #222;
        color: #eee;
        border: 1px solid #555;
        padding: 4px 8px;
        font-family: monospace;
        font-size: 13px;
      }
      button {
        background: #333;
        color: #eee;
        border: 1px solid #555;
        padding: 4px 12px;
        cursor: pointer;
        font-family: monospace;
        font-size: 13px;
      }
      button:hover {
        background: #444;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #info {
        font-size: 12px;
        color: #aaa;
      }
      canvas {
        border: 1px solid #444;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Syphon/Spout Zero-Copy Receiver Test</h1>
    <div id="controls">
      <select id="senderList">
        <option value="">-- Select Sender --</option>
      </select>
      <button id="refreshBtn">Refresh</button>
      <button id="connectBtn" disabled>Connect</button>
      <button id="disconnectBtn" disabled>Disconnect</button>
      <label
        title="When checked, the macOS receiver applies a vertical flip when staging the IOSurface for importSharedTexture. Toggling while connected hot-swaps the native flag — the next frame uses the new path."
        ><input type="checkbox" id="flipYCheckbox" checked />Flip Y (mac)</label
      >
    </div>
    <div id="info">Select a sender to connect</div>
    <canvas id="canvas"></canvas>
    <!-- All renderer logic lives in the preload (src/preload/receiver.ts).
         The preload shares this window's global scope because the window
         runs with `nodeIntegration: true, contextIsolation: false`. -->
  </body>
</html>
