[package]
name = "electron-texture-bridge-native"
version = "0.1.0"
edition = "2021"
description = "Cross-platform GPU texture sharing: Spout (Windows) + Syphon Metal (macOS)"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8"] }
napi-derive = { version = "2", features = ["type-def"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Foundation",
  "Win32_Security",
]}

[build-dependencies]
napi-build = "2"
cc = "1"
